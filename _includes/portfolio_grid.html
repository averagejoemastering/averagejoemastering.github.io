    <script>
function scrollSlider(direction) {
    const slider = document.getElementById('audioSlider');
    if (!slider) return;

    // Detect how wide one single item slot currently is
    const firstItem = slider.querySelector('.audio-slide-item');
    if (!firstItem) return;
    
    const slideWidth = firstItem.clientWidth + 20; // item width + 20px gap
    
    // Scroll left or right
    slider.scrollBy({
        left: direction * slideWidth,
        behavior: 'smooth'
    });
}
document.addEventListener('play', function(e) {
    // Get all audio elements on the page
    const allAudios = document.getElementsByTagName('audio');
    
    // Loop through them and pause any track that isn't the one that just started playing
    for (let i = 0; i < allAudios.length; i++) {
        if (allAudios[i] !== e.target) {
            allAudios[i].pause();
            // Optional: Uncomment the next line if you want to reset the paused songs back to the start
            // allAudios[i].currentTime = 0; 
        }
    }
}, true); // The "true" here is important to catch the play event as it bubbles up
</script>
